<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-ask-first preview</title>
<style>
  /* 这个页面只是给 README 出图用的：把真实插件的 lib/client.js 原样加载进来，
     外面裹一个 700×660 的"窗口"盒子当宿主。唯一的改动是把面板的固定定位
     改成相对这个盒子（见 `.frame .dshaf-backdrop`），否则它会铺满整块屏幕，
     截出来就是一张空荡荡的大图。 */
  :root{
    --sys-color-on-surface:#1d1d1f;
    --sys-color-on-surface-subtle:#6e6e73;
    --sys-color-primary:#0071e3;
    --sys-color-cdt-base-container:#fff;
    --sys-color-divider:rgba(0,0,0,.1);
    --sys-color-neutral-outline:rgba(0,0,0,.14);
    --sys-color-tonal-container:rgba(0,113,227,.08);
    --sys-color-on-tonal-container:#0b4f9e;
    --sys-color-tonal-outline:rgba(11,79,158,.16);
    --sys-color-neutral-container:rgba(0,0,0,.07);
    --sys-color-state-hover-on-subtle:rgba(0,0,0,.05);
    --dsh-font-family-text:-apple-system,"SF Pro Text","PingFang SC","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#e8e8ec;
    font-family:-apple-system,"SF Pro Text","PingFang SC","Segoe UI",system-ui,sans-serif;
    color:#1d1d1f;
    display:flex;align-items:center;justify-content:center;
  }
  .frame{
    position:relative;width:700px;height:660px;overflow:hidden;
    background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.12);
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 24px 22px;
  }
  .thread{margin-bottom:18px;display:flex;justify-content:flex-end}
  .bubble{
    max-width:74%;background:#f0f0f2;border-radius:14px;padding:10px 14px;
    font-size:13.5px;line-height:1.55;
  }
  .composer{
    background:#fff;border:1px solid rgba(0,0,0,.11);border-radius:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.05);
    padding:10px 12px 8px;
  }
  /* 注意：无头截图里 <textarea> 的文本不会被绘制（已单独验证），
     所以这里用一个等价的 div 当草稿区，只为截图可读；逻辑仍读同一个草稿串。 */
  .composer > .draftbox{
    font:inherit;font-size:13.5px;line-height:1.6;color:#1d1d1f;
    min-height:46px;padding:4px 2px 6px;
  }
  .bar{display:flex;align-items:center;gap:8px;padding-top:4px;border-top:1px solid rgba(0,0,0,.06)}
  .grow{flex:1}
  .send{
    height:28px;padding:0 14px;border-radius:8px;border:0;
    background:#0071e3;color:#fff;font:inherit;font-size:12.5px;font-weight:500;
  }
  .model{font-size:11.5px;color:#8e8e93}

  /* 只改定位的容器：面板相对窗口盒子居中，而不是相对整块屏幕 */
  .frame .dshaf-backdrop{position:absolute;inset:0;padding:0 16px 24px;border-radius:14px}
  .frame .dshaf-panel{max-height:100%}
  /* 真机里面板最高到 74vh（1080p 上约 800px），结果框自然长得更长；
     这里把窗口盒子做小了，同步把结果框放高一点，截出来才是真机观感。 */
  .frame .dshaf-textarea{min-height:320px}
</style>
</head>
<body>
  <div class="frame">
    <div class="thread"><div class="bubble">帮我做个排班的小工具</div></div>
    <div class="composer">
      <div class="draftbox" id="draft">帮我做个排班的小工具</div>
      <div class="bar">
        <span id="slot"></span>
        <span class="grow"></span>
        <span class="model">deepseek-v4.1-flash</span>
        <button class="send">发送</button>
      </div>
    </div>
  </div>

<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script>
  /* ---- 宿主替身：只补 lib/client.js 真正用到的那几个接口 ---- */
  var DRAFT = document.getElementById("draft").textContent;
  var REGISTRY = [];

  window.__ModuleLoader__ = { load: function (mod) { REGISTRY.push(mod); } };

  /* /ask 与 /rewrite 的假后端。形状照抄真机实测返回（2026-10）。 */
  var ASK = {
    ok: true,
    value: {
      guess: "我理解你想要的是做一个团队排班小工具：谁哪天上班一眼能看见，排好的表还能导出去发给别人。",
      questions: [
        { id: "q1", question: "按什么排？", hint: "",
          options: ["按周排", "按月排", "自定义起止日", "我不知道，你替我定"] },
        { id: "q2", question: "排好的表怎么带走？", hint: "",
          options: ["导出 Excel", "导出图片 / PDF", "直接复制文本", "我不知道，你替我定"] },
        { id: "q3", question: "谁看这个表？", hint: "",
          options: ["自己排、发群里", "同事各自查自己的班", "管理员维护、别人只看", "我不知道，你替我定"] },
      ],
    },
  };

  var REWRITE = {
    ok: true,
    value: {
      text:
        "做一个团队排班小工具：按周排班，一周一行，一眼看出谁哪天上班。\n\n约束：\n- 浏览器里打开就能用，不接后端、不做账号。\n- 排好的表能导出成一份文件，导出的列跟页面上一致。\n- 自己排完发到群里，不需要登录和权限区分。\n\n完成标准：\n- 打开就能排本周的班，不用先配置。\n- 关掉再打开，上周的内容还在。\n\n[待补充：团队人数、要不要标早班 / 晚班]",
    },
  };

  window.fetch = function (url) {
    var body = String(url).indexOf("/rewrite") >= 0 ? REWRITE : ASK;
    return new Promise(function (resolve) {
      setTimeout(function () {
        resolve({ ok: true, status: 200, json: function () { return Promise.resolve(body); } });
      }, 40);
    });
  };

  /* ---- 把插件的 apply 跑起来 ---- */
  var slotEntry = null;
  var ctx = {
    effect: function (fn) { fn(); },
    slots: {
      inject: function (name, register) { register(); },
      register: function (meta, Component) { slotEntry = { meta: meta, Component: Component }; return slotEntry; },
    },
  };

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function q(sel) { return document.querySelector(sel); }

  async function boot() {
    for (var i = 0; i < REGISTRY.length; i += 1) {
      var mod = REGISTRY[i];
      var exp = mod.factory(function (name) {
        if (name === "react") return window.React;
        // 故意不给 createPortal：client.js 会退化成原地渲染，面板就落在
        // 这个窗口盒子里，能被截进来。宿主里走的是 portal 到 body。
        if (name === "react-dom") return { createPortal: undefined };
        throw new Error("unexpected require: " + name);
      });
      mod.exports = exp;
      if (typeof exp.apply === "function") exp.apply(ctx);
    }

    var inputActions = {
      snapshot: { draft: DRAFT },
      setDraft: function (text) { DRAFT = text; window.__applied = text; },
    };
    ReactDOM.createRoot(q("#slot")).render(
      React.createElement(slotEntry.Component, { inputActions: inputActions, useInput: null }),
    );

    var state = new URLSearchParams(location.search).get("state") || "1";
    await wait(90);
    if (state === "1") return;            // 只有输入框里的按钮

    q(".dshaf-btn").click();               // 打开面板
    await wait(260);
    if (state === "2") {                   // 追问界面，答了两题、第三题留空
      var g = document.querySelectorAll(".dshaf-chips");
      g[0].querySelectorAll("button")[1].click();
      await wait(40);
      g[1].querySelectorAll("button")[0].click();
      await wait(40);
      return;
    }

    if (state === "3") {                   // 重写结果
      var c = document.querySelectorAll(".dshaf-chips");
      c[0].querySelectorAll("button")[0].click();
      await wait(40);
      c[1].querySelectorAll("button")[0].click();
      await wait(40);
      c[2].querySelectorAll("button")[3].click();   // 我不知道，你替我定
      await wait(60);
      var primary = Array.prototype.filter.call(
        document.querySelectorAll(".dshaf-actPrimary"),
        function (b) { return /重写/.test(b.textContent); },
      )[0];
      primary.click();
      await wait(300);
    }
  }

  window.__boot = boot;
</script>
<script src="../lib/client.js"></script>
<script>
  window.__ready = window.__boot();
</script>
</body>
</html>
