name: superagent acceptance probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  probe:
    if: github.repository == 'BAIYE0303/dsh-ask-first'
    runs-on: ubuntu-latest
    steps:
      - name: Post the mention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/1/comments"             -f body='@BAIYE0303 README.md 里有个拼写错误：`option normalizaton` 应该是 `option normalisation`。请改正这一处并开一个 PR。'             --jq .html_url
