description:
  en: 'A clarity button in the composer: restates what you meant, asks two or three questions with clickable options, then rewrites the draft into a request an agent can start on. It never sends for you.'
  zh: '输入框里的一个澄清按钮：先复述它听懂的意思，再问两三个带可点选项的问题，最后把草稿重写成 agent 能直接开工的需求。它从不替你发送。'
